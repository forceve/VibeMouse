name: ci

on:
  push:
  pull_request:

jobs:
  # ── Python tests (Linux / Windows / macOS) ──────────────────────────────
  test:
    name: pytest (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install package and CI dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install --no-deps -e .
          python - <<'PY'
          import pathlib
          import subprocess
          import sys
          import tomllib

          data = tomllib.loads(pathlib.Path("pyproject.toml").read_text(encoding="utf-8"))
          deps = data["project"]["optional-dependencies"]["ci"]
          subprocess.check_call([sys.executable, "-m", "pip", "install", *deps])
          PY

      - name: Run tests
        run: pytest

  # ── Panel build (Linux / Windows / macOS) ───────────────────────────────
  panel-build:
    name: dotnet panel (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Run panel tests
        run: dotnet test panel/VibeMouse.Panel.Tests/VibeMouse.Panel.Tests.csproj -c Release

      - name: Build panel
        run: dotnet build panel/VibeMouse.Panel/VibeMouse.Panel.csproj -c Release --no-restore
